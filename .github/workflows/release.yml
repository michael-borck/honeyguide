# Release pipeline (pattern copied from cite-sight): a v* tag triggers
# npm publish, multi-arch Docker images, and (once the shell is chosen,
# ADR-0007) desktop installers.
#
# Secrets expected (add under Settings → Secrets and variables → Actions):
#   NPM_TOKEN            npm automation token for @michaelborck/* publishes
#   DOCKERHUB_USERNAME   optional — Docker Hub mirror of the GHCR image
#   DOCKERHUB_TOKEN      optional — Docker Hub access token
# GHCR pushes use the built-in GITHUB_TOKEN; no secret needed.
#
# macOS signing/notarisation (for the desktop job once enabled, ADR-0007):
#   APPLE_CERTIFICATE           base64 .p12: Developer ID Application + key  [set]
#   APPLE_CERTIFICATE_PASSWORD  password for the .p12                        [set]
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Michael Borck (H7XP9TYKB5)"  [set]
#   APPLE_TEAM_ID               H7XP9TYKB5                                   [set]
#   APPLE_ID                    Apple ID email for notarytool                [set]
#   APPLE_APP_SPECIFIC_PASSWORD app-specific password from account.apple.com [set]
# Electron mapping if that shell is chosen: CSC_LINK=APPLE_CERTIFICATE,
# CSC_KEY_PASSWORD=APPLE_CERTIFICATE_PASSWORD; Tauri uses these names as-is.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish core
        if: env.NPM_TOKEN != ''
        run: npm publish --access public -w @michaelborck/honeyguide-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish CLI
        if: env.NPM_TOKEN != ''
        run: npm publish --access public -w @michaelborck/honeyguide-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Skipped (no NPM_TOKEN configured)
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN not set — skipping npm publish."

  docker:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/michael-borck/honeyguide
            ${{ env.DOCKERHUB_USERNAME != '' && 'docker.io/michaelborck/honeyguide' || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Electron desktop installers (ADR-0010). Pipeline copied from cite-sight,
  # including its keychain and notarisation workarounds.
  desktop:
    uses: michael-borck/app-hq/.github/workflows/electron-release.yml@main
    with:
      product-name: Honeyguide
      node-version: '24'
      preflight-command: npm run build && npm test
      build-command: npm run build
      package-command: |
        cd packages/desktop
        npx electron-builder --$PLATFORM --publish never
      notarize-check-command: |
        cd packages/desktop
        npx electron-builder --mac --publish never
      notarize-check-artifact-root: packages/desktop/release
      signing-mode: custom
      notarize-mode: none
      publish-mode: artifacts
      publish-release: false
      post-package-command: |
        cd packages/desktop
        set -e
        KEY_DIR="$RUNNER_TEMP/apple-api"
        KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
        mkdir -p "$KEY_DIR"
        printf '%s' "$APPLE_API_KEY_CONTENT" | openssl base64 -d -A > "$KEY_PATH"
        chmod 600 "$KEY_PATH"
        IDENTITY=$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
        if [ -z "$IDENTITY" ]; then
          echo "Error: no Developer ID Application identity in keychain"
          exit 1
        fi
        for dmg in release/*.dmg; do
          codesign --sign "$IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          for attempt in 1 2 3; do
            xcrun stapler staple "$dmg" && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "stapler staple failed (attempt $attempt); retrying..."
            sleep 15
          done
        done
      notarize-check-verify: |
        cd packages/desktop
        set -e
        found=0
        for dmg in release/*.dmg; do
          found=1
          codesign --verify --strict --verbose=2 "$dmg"
          for attempt in 1 2 3; do
            xcrun stapler validate "$dmg" && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "stapler validate failed (attempt $attempt); retrying..."
            sleep 15
          done
        done
        [ "$found" -eq 1 ] || { echo "No DMG found"; exit 1; }
      artifact-globs: |
        packages/desktop/release/*.dmg
        packages/desktop/release/*.dmg.blockmap
        packages/desktop/release/*.zip
        packages/desktop/release/*.zip.blockmap
        packages/desktop/release/*.exe
        packages/desktop/release/*.AppImage
        packages/desktop/release/*.deb
        packages/desktop/release/*.yml
        packages/desktop/release/*.yaml
        packages/desktop/release/*.blockmap
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [docker, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
